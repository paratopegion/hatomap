<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ハト観察マップ V4.5</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{font-family:sans-serif;margin:0;padding:10px;background:#eef6ff}#map{height:65vh;border-radius:12px}.card{background:#fff;padding:10px;margin:10px 0;border-radius:10px}input,textarea,button{width:100%;padding:10px;margin:4px 0;box-sizing:border-box}button{background:#2d6cdf;color:#fff;border:none;border-radius:8px}</style></head><body><h2>🕊️ ハト観察マップ V4.5</h2><div id="map"></div><div class="card"><input id="observer" placeholder="観察者名"><input id="count" type="number" min="1" value="1"><input id="observeDate" type="datetime-local"><textarea id="memo" placeholder="メモ"></textarea><button onclick="getLocation()">📍現在地取得</button><div id="status">地図タップまたはGPS取得</div></div><script>const map=L.map('map').setView([35.66,138.56],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'OSM'}).addTo(map);let lat=null,lng=null,current=null;function getLocation(){status.innerText='GPS取得中';navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lng=p.coords.longitude;status.innerText='GPS取得成功';if(current)map.removeLayer(current);current=L.marker([lat,lng]).addTo(map).bindPopup('現在位置').openPopup();map.setView([lat,lng],16);},e=>{status.innerText='GPS失敗。地図をタップしてください';},{enableHighAccuracy:true,timeout:20000});}map.on('click',e=>{lat=e.latlng.lat;lng=e.latlng.lng;if(current)map.removeLayer(current);current=L.marker([lat,lng]).addTo(map).bindPopup('記録予定地点').openPopup();status.innerText='位置選択完了';});</script></body></html>
