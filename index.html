
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🕊️ ハト観察マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
  font-family:sans-serif;
  margin:0;
  padding:10px;
  background:#eef6ff;
}

h1{
  text-align:center;
}

#map{
  height:400px;
  border-radius:12px;
}

.card{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}

input,
button{
  width:100%;
  padding:10px;
  margin-top:8px;
  box-sizing:border-box;
}

button{
  background:#4a6fa5;
  color:white;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<h1>🕊️ ハト観察マップ</h1>

<div id="map"></div>

<div class="card">

<input
id="observer"
placeholder="観察者名">

<input
id="count"
type="number"
min="1"
value="1">

<button onclick="saveRecord()">
記録送信
</button>

<p id="status">
GPS取得中...
</p>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API =
"https://script.google.com/macros/s/AKfycbycQMQqAz7wk-uuiDWK9bePCKmI-YilumZDxJWKHsIX4Vv34RsKR0uZYVqbt-s4DM0Wgw/exec";

let lat = null;
let lng = null;

const map =
L.map("map").setView(
[35.66,138.56],
11
);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);

navigator.geolocation.getCurrentPosition(

function(pos){

  lat = pos.coords.latitude;
  lng = pos.coords.longitude;

  status.textContent =
  "✅ GPS取得成功";

  map.setView(
  [lat,lng],
  15
  );

  L.marker([lat,lng])
  .addTo(map);

},

function(){

  status.textContent =
  "GPS取得失敗";

}

);

async function saveRecord(){

  if(!observer.value){

    alert("観察者名を入力してください");
    return;

  }

  await fetch(API,{

    method:"POST",

    body:JSON.stringify({

      observeDate:
      new Date().toISOString(),

      observer:
      observer.value,

      count:
      count.value,

      lat:
      lat,

      lng:
      lng,

      weather:"-",

      memo:"",

      photo:""

    })

  });

  alert("保存しました");

}

</script>

</body>
</html>
