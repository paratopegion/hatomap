<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🕊️ ハト観察マップ V5</title>

@1.9.4/dist/leaflet.css">
unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  margin:0;
  padding:10px;
  font-family:sans-serif;
  background:#eef6ff;
}

h1{
  text-align:center;
}

#map{
  height:60vh;
  border-radius:12px;
}

.card{
  background:white;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
}

input,textarea,button{
  width:100%;
  box-sizing:border-box;
  margin-top:6px;
  padding:10px;
}

button{
  background:#2d6cdf;
  color:white;
  border:none;
  border-radius:8px;
}
</style>

</head>

<body>

<h1>🕊️ ハト観察マップ V5</h1>

<div id="map"></div>

<div class="card">

<input id="observer" placeholder="観察者名">

<input id="count" type="number" min="1" value="1">

<input id="observeDate" type="datetime-local">

<textarea id="memo" placeholder="メモ"></textarea>

<input id="photo" type="file" accept="image/*">

<button onclick="getLocation()">📍現在地取得</button>

<div id="status">
地図タップまたはGPS取得
</div>

<button onclick="saveRecord()">
🕊️ 記録送信
</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbwys9KUCLa5rgy_OAr7-lpWDeG8JqotpuF5egFAz-b1Nk5d1Lvoiw7cYYNFfMJqYMlCzw/exec";

let lat = null;
let lng = null;
let current = null;

const map =
L.map("map")
.setView([35.66,138.56],11);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
 attribution:"OpenStreetMap"
}
).addTo(map);

function getLocation(){

 status.innerText="GPS取得中";

 navigator.geolocation.getCurrentPosition(

  pos=>{

   lat=pos.coords.latitude;
   lng=pos.coords.longitude;

   if(current){
    map.removeLayer(current);
   }

   current=L.marker([lat,lng])
   .addTo(map)
   .bindPopup("現在位置")
   .openPopup();

   map.setView([lat,lng],16);

   status.innerText="GPS取得成功";

  },

  err=>{

   status.innerText=
   "GPS失敗。地図をタップしてください";

  },

  {
   enableHighAccuracy:true,
   timeout:20000
  }

 );

}

map.on("click",e=>{

 lat=e.latlng.lat;
 lng=e.latlng.lng;

 if(current){
  map.removeLayer(current);
 }

 current=L.marker([lat,lng])
 .addTo(map)
 .bindPopup("記録予定地点")
 .openPopup();

 status.innerText="位置選択完了";

});

function saveRecord(){

 if(lat===null || lng===null){

   alert("位置を選択してください");
   return;

 }

 alert("V5次段階で保存処理を追加します");

}

</script>

</body>
</html>
