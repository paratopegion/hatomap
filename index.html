
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🕊️ ハト観察マップ V3</title>

<link rel="stylesheet1.9.4/dist/leaflet.css"/>

<style>
body{
  margin:0;
  padding:12px;
  font-family:sans-serif;
  background:linear-gradient(#87ceeb,#eef6ff);
}

h1{
  text-align:center;
}

#map{
  height:360px;
  border-radius:12px;
}

.card{
  background:white;
  margin-top:10px;
  padding:12px;
  border-radius:12px;
}

input,button{
  width:100%;
  padding:10px;
  margin-top:5px;
  box-sizing:border-box;
}

button{
  background:#4a6fa5;
  color:white;
  border:none;
}

.stats{
  display:flex;
  gap:10px;
}

.stats div{
  flex:1;
  background:#eef6ff;
  text-align:center;
  padding:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>🕊️ ハト観察マップ V3</h1>

<div id="map"></div>

<div class="card">

<input id="observer" placeholder="観察者名">

<input id="count" type="number" min="1" value="1">

<button onclick="saveRecord()">
記録を送信
</button>

<p id="status">
GPS取得中...
</p>

</div>

<div class="card stats">

<div>
<b id="recordCount">0</b>
<br>
記録数
</div>

<div>
<b id="birdCount">0</b>
<br>
総羽数
</div>

<div>
<b id="averageBirds">0</b>
<br>
平均
</div>

</div>

pkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API =
"https://script.google.com/macros/s/AKfycbycQMQqAz7wk-uuiDWK9bePCKmI-YilumZDxJWKHsIX4Vv34RsKR0uZYVqbt-s4DM0Wgw/exec";

let lat = null;
let lng = null;

const map =
L.map("map").setView([35.66,138.56],11);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
 attribution:"© OpenStreetMap"
}
).addTo(map);

if(navigator.geolocation){

  navigator.geolocation.getCurrentPosition(

    pos=>{

      lat=pos.coords.latitude;
      lng=pos.coords.longitude;

      status.textContent =
      "✅ GPS取得成功";

      map.setView([lat,lng],15);

      L.marker([lat,lng])
      .addTo(map)
      .bindPopup("現在位置");

    },

    err=>{

      status.textContent =
      "GPS取得失敗";

    }

  );

}

async function saveRecord(){

  if(!observer.value){
    alert("観察者名を入力してください");
    return;
  }

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      observeDate:new Date().toISOString(),
      observer:observer.value,
      count:count.value,
      lat:lat,
      lng:lng,
      weather:"-",
      memo:"",
      photo:""
    })
  });

  alert("保存しました");

  loadData();

}

async function loadData(){

  try{

    const res =
    await fetch(API);

    const data =
    await res.json();

    let totalBirds = 0;

    document.getElementById(
      "recordCount"
    ).textContent =
    data.length;

    data.forEach(x=>{

      totalBirds +=
      Number(x.count || 0);

      if(x.lat && x.lng){

        L.marker([
          Number(x.lat),
          Number(x.lng)
        ])
        .addTo(map);

      }

    });

    document.getElementById(
      "birdCount"
    ).textContent =
    totalBirds;

    document.getElementById(
      "averageBirds"
    ).textContent =
    data.length
    ? (totalBirds/data.length).toFixed(1)
    : 0;

  }catch(e){

    console.log(e);

  }

}

loadData();

</script>

</body>
</html>
