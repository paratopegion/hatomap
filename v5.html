
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🕊️ ハト観察マップ V5</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{
  font-family:sans-serif;
  margin:0;
  padding:10px;
  background:#eef6ff;
}

#map{
  height:70vh;
  border-radius:12px;
}

.card{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-top:10px;
}

input,textarea,button{
  width:100%;
  box-sizing:border-box;
  padding:10px;
  margin:5px 0;
}

button{
  background:#2d6cdf;
  color:white;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<h2>🕊️ ハト観察マップ V5</h2>

<div id="map"></div>

<div class="card">

<input id="observer" placeholder="観察者名">

<input id="count" type="number" value="1" min="1">

<input id="observeDate" type="datetime-local">

<textarea id="memo" placeholder="メモ"></textarea>

<button onclick="getLocation()">
📍現在地取得
</button>

<div id="status">
地図タップまたはGPS取得
</div>

</div>

<script>

const map = L.map('map').setView([35.66,138.56],11);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
attribution:'© OpenStreetMap'
}).addTo(map);

let lat = null;
let lng = null;
let currentMarker = null;

function getLocation(){

  status.innerText = "GPS取得中...";

  navigator.geolocation.getCurrentPosition(

    pos => {

      lat = pos.coords.latitude;
      lng = pos.coords.longitude;

      if(currentMarker){
        map.removeLayer(currentMarker);
      }

      currentMarker =
      L.marker([lat,lng])
      .addTo(map)
      .bindPopup("📍現在位置")
      .openPopup();

      map.setView([lat,lng],16);

      status.innerText = "✅ GPS取得成功";

    },

    err => {

      status.innerText =
      "GPS失敗。地図をタップしてください";

    },

    {
      enableHighAccuracy:true,
      timeout:20000
    }

  );

}

map.on("click",e=>{

  lat = e.latlng.lat;
  lng = e.latlng.lng;

  if(currentMarker){
    map.removeLayer(currentMarker);
  }

  currentMarker =
  L.marker([lat,lng])
  .addTo(map)
  .bindPopup("📌選択位置")
  .openPopup();

  status.innerText =
  "✅ 位置選択完了";

});

</script>

</body>
</html>
